name: Tests
on:
  push:
    paths-ignore: [".github/keepalive.txt"]
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q apwx tools
      - name: Unit and end-to-end tests (offline)
        run: python -m unittest discover -s tests -v